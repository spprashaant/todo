<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gauntlet · Todos vs Things and Asana</title>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --ink:#1d1f23; --mute:#7a808a; --line:#e6e8ec; --win:#1f9d55; --lose:#d64545; --judge:#b7791f; --build:#3b6fd8; }
  * { box-sizing: border-box; }
  body { margin:0; font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color:var(--ink); background:var(--bg); }
  header { position:sticky; top:0; z-index:5; background:rgba(244,245,247,.9); backdrop-filter:blur(12px); border-bottom:1px solid var(--line); }
  .bar { max-width:1400px; margin:0 auto; padding:14px 24px; display:flex; gap:24px; align-items:center; flex-wrap:wrap; }
  h1 { font-size:17px; margin:0; letter-spacing:-.01em; }
  h1 small { color:var(--mute); font-weight:500; margin-left:6px; }
  .stat { display:flex; gap:8px; align-items:baseline; }
  .stat b { font-size:20px; font-variant-numeric:tabular-nums; }
  .stat span { color:var(--mute); }
  .pill { display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:999px; font-weight:600; font-size:12px; }
  .pill::before { content:""; width:7px; height:7px; border-radius:50%; background:currentColor; }
  .pill.won { color:var(--win); background:#e5f6ec; } .pill.judging { color:var(--judge); background:#fbf1de; }
  .pill.building { color:var(--build); background:#e6eefc; } .pill.lose { color:var(--lose); background:#fbe6e6; }
  .pill.idle { color:var(--mute); background:#eceef1; }
  main { max-width:1400px; margin:0 auto; padding:20px 24px 60px; display:grid; grid-template-columns: 1fr 340px; gap:20px; }
  @media (max-width: 1000px) { main { grid-template-columns: 1fr; } }
  .pieces { display:grid; gap:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px 18px; }
  .card h2 { margin:0; font-size:15px; display:flex; gap:10px; align-items:center; }
  .card .sub { color:var(--mute); margin:2px 0 10px; font-size:12.5px; }
  .shots { display:grid; grid-template-columns: 1fr 1fr; gap:14px; margin-top:10px; }
  .shot h3 { margin:0 0 6px; font-size:12px; color:var(--mute); text-transform:uppercase; letter-spacing:.06em; display:flex; gap:8px; align-items:center; }
  .pair { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  .pair figure { margin:0; background:#fafbfc; border:1px solid var(--line); border-radius:8px; overflow:hidden; position:relative; }
  .pair img { width:100%; display:block; max-height:340px; object-fit:contain; object-position:top; background:#fff; cursor:zoom-in; }
  .pair figcaption { font-size:11px; padding:4px 8px; color:var(--mute); display:flex; justify-content:space-between; }
  .pair figure.picked { outline:2px solid var(--win); }
  .gap { margin-top:10px; padding:10px 12px; background:#fbf7ee; border-radius:8px; font-size:13px; }
  .gap b { color:var(--judge); }
  .note { margin-top:8px; color:var(--mute); font-size:12.5px; }
  .hist { display:flex; gap:4px; flex-wrap:wrap; margin-top:10px; }
  .hist i { width:22px; height:22px; border-radius:6px; font-style:normal; font-size:10px; display:grid; place-items:center; color:#fff; background:var(--lose); }
  .hist i.half { background:linear-gradient(135deg, var(--win) 50%, var(--lose) 50%); }
  .hist i.win { background:var(--win); } .hist i.pend { background:#c9ced6; }
  aside .card { position:sticky; top:74px; max-height:calc(100vh - 100px); overflow:auto; }
  .ev { padding:8px 0; border-bottom:1px solid var(--line); font-size:12.5px; }
  .ev time { color:var(--mute); font-variant-numeric:tabular-nums; margin-right:6px; }
  .empty { color:var(--mute); font-size:13px; padding:20px 0; }
  dialog { border:0; padding:0; border-radius:12px; max-width:95vw; max-height:95vh; }
  dialog img { max-width:95vw; max-height:92vh; display:block; }
  .suite-fail { color:var(--lose); font-size:12px; }
  .card h2 .vs { margin-left:auto; color:var(--mute); font-weight:500; font-size:12px; }
</style>
</head>
<body>
<header><div class="bar">
  <h1>Todos vs Things and Asana <small>gauntlet loop · blind A/B · panel of 3 harsh critics · equalized rendering</small></h1>
  <div class="stat"><b id="won">0/0</b><span>pieces won</span></div>
  <div class="stat"><b id="suite">–</b><span>TodoMVC suite</span></div>
  <div class="stat"><b id="recur">–</b><span>repeat behaviour check</span></div>
  <div class="stat"><b id="rounds">0</b><span>rounds judged</span></div>
  <div class="stat"><span id="updated"></span></div>
</div></header>
<main>
  <section class="pieces" id="pieces"><div class="empty">Waiting for the first round…</div></section>
  <aside><div class="card"><h2>Live feed</h2><div id="events"><div class="empty">No events yet.</div></div></div></aside>
</main>
<dialog id="zoom" onclick="this.close()"><img id="zoomimg" alt=""></dialog>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const get = async (u, text) => { try { const r = await fetch(u + (u.includes('?') ? '&' : '?') + 't=' + Date.now()); if (!r.ok) return null; return text ? r.text() : r.json(); } catch { return null; } };
const ago = iso => { if (!iso) return ''; const s = Math.round((Date.now() - new Date(iso)) / 1000); return s < 60 ? s + 's ago' : s < 3600 ? Math.round(s/60) + 'm ago' : Math.round(s/3600) + 'h ago'; };

const barOf = p => p.bar || 'Things';
const sizesOf = p => Object.keys(p.shots || {});
const allWon = (p, w) => !!w && sizesOf(p).every(s => w[s]);
const anyWon = (p, w) => !!w && sizesOf(p).some(s => w[s]);
function pairHTML(p, r, size) {
  if (!r) return '<div class="empty">no pair yet</div>';
  const base = `/gauntlet/${p.id}/r${r.round}/${size}-`;
  const key = r.key?.[size], pick = r.won ? (r.won[size] ? key : (key === 'A' ? 'B' : 'A')) : null;
  const cap = L => key ? (L === key ? 'ours' : barOf(p)) : L;
  const fig = L => `<figure class="${pick === L ? 'picked' : ''}"><img src="${base}${L}.png?r=${r.pairedAt}" onclick="zoom(this.src)" alt=""><figcaption><span>${L} · ${cap(L)}</span><span>${pick === L ? 'panel’s pick' : ''}</span></figcaption></figure>`;
  return `<div class="pair">${fig('A')}${fig('B')}</div>`;
}
function cardHTML(p, s) {
  const rounds = s?.rounds || [];
  const judged = rounds.filter(r => r.won);
  const last = [...rounds].reverse().find(r => r.pairedAt);
  const lastJudged = judged[judged.length - 1];
  const state = s?.state || 'idle';
  const hist = rounds.map(r => !r.won ? `<i class="pend" title="round ${r.round}: awaiting critic">${r.round}</i>`
    : `<i class="${allWon(p, r.won) ? 'win' : anyWon(p, r.won) ? 'half' : ''}" title="round ${r.round}: ${Object.entries(r.won).map(([s, w]) => `${s} ${w ? 'ours' : barOf(p)}`).join(', ')}">${r.round}</i>`).join('');
  const tally = size => last?.votes?.length ? ` ${last.votes.filter(v => v[size]).length}/${last.panel || last.votes.length}` : '';
  const res = size => last?.won ? `<span class="pill ${last.won[size] ? 'won' : 'lose'}">${last.won[size] ? 'ours picked' : barOf(p) + ' picked'}${tally(size)}</span>`
    : last?.votes?.length ? `<span class="pill judging">votes for ours${tally(size)}</span>` : '';
  return `<article class="card">
    <h2>${esc(p.title)} <span class="pill ${state}">${state}${s?.round ? ' · round ' + s.round : ''}</span><span class="vs">vs ${esc(barOf(p))}</span></h2>
    <div class="sub">${esc(p.judge || '')}</div>
    ${p.kind === 'behaviour' ? behaviourHTML(p, s) : `<div class="shots">${sizesOf(p).map(sz =>
      `<div class="shot"><h3>${esc(sz)} ${res(sz)}</h3>${pairHTML(p, last, sz)}</div>`).join('')}</div>`}
    ${lastJudged && !allWon(p, lastJudged.won) ? `<div class="gap"><b>Biggest gap (round ${lastJudged.round}):</b> ${esc(lastJudged.gap)}${lastJudged.why ? `<div class="note">${esc(lastJudged.why)}</div>` : ''}</div>` : ''}
    ${last?.note ? `<div class="note">Builder, round ${last.round}: ${esc(last.note)}</div>` : ''}
    ${s?.working && state === 'building' ? `<div class="note">Working on: ${esc(s.working)}</div>` : ''}
    <div class="hist">${hist}</div>
  </article>`;
}
let recur = null;
function behaviourHTML(p, s) {
  const r = recur;
  const last = [...(s?.rounds || [])].reverse().find(x => x.won);
  const rows = r ? [...(r.failed || []).map(f => `<div class="ev"><b style="color:var(--lose)">FAIL</b> ${esc(f.name)}<div class="note">${esc(f.error)}</div></div>`)] : [];
  return `<div class="shots" style="grid-template-columns:1fr">
    <div class="shot"><h3>Scripted check ${r ? `<span class="pill ${r.green ? 'won' : 'lose'}">${r.passing}/${r.total} scenarios</span>` : ''}</h3>
      ${r ? (rows.join('') || '<div class="note">Every scenario passes: completing, unticking, deleting, Complete All, Clear completed, schedules and end dates.</div>') : '<div class="empty">not run yet</div>'}
      ${r ? `<div class="note">run ${ago(r.at)} by ${esc(r.by)}</div>` : ''}</div>
    ${last ? `<div class="shot"><h3>Adversarial critics <span class="pill ${last.won.behaviour ? 'won' : 'lose'}">${last.won.behaviour ? 'could not break it' : 'broke it'}</span></h3></div>` : ''}
  </div>`;
}
async function tick() {
  recur = await get('/gauntlet/recur.json');
  const cfg = await get('/gauntlet/pieces.json');
  if (!cfg) return;
  cfg.pieces.sort((a, b) => (b.bar ? 1 : 0) - (a.bar ? 1 : 0)); // the pieces in play (vs Asana) first
  const statuses = await Promise.all(cfg.pieces.map(p => get(`/gauntlet/${p.id}/status.json`)));
  $('#pieces').innerHTML = cfg.pieces.map((p, i) => cardHTML(p, statuses[i])).join('');
  const won = statuses.filter(s => s?.state === 'won').length;
  $('#recur').innerHTML = recur ? `<span style="color:${recur.green ? 'var(--win)' : 'var(--lose)'}">${recur.passing}/${recur.total}</span>` : '–';
  $('#won').textContent = `${won}/${cfg.pieces.length}`;
  $('#rounds').textContent = statuses.reduce((n, s) => n + (s?.rounds || []).filter(r => r.won).length, 0);
  const suite = await get('/gauntlet/suite.json');
  $('#suite').innerHTML = suite ? `<span style="color:${suite.green ? 'var(--win)' : 'var(--lose)'}">${suite.passing}/${suite.total}</span>` : '–';
  $('#updated').textContent = suite ? `suite run ${ago(suite.at)} by ${suite.by}` : '';
  const ev = await get('/gauntlet/events.jsonl', true);
  if (ev) {
    const lines = ev.trim().split('\n').filter(Boolean).map(l => { try { return JSON.parse(l); } catch { return null; } }).filter(Boolean).reverse().slice(0, 120);
    $('#events').innerHTML = lines.map(e => `<div class="ev"><time>${new Date(e.at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</time>${esc(e.text)}</div>`).join('') || '<div class="empty">No events yet.</div>';
  }
}
function zoom(src) { $('#zoomimg').src = src; $('#zoom').showModal(); }
tick(); setInterval(tick, 3000);
</script>
</body>
</html>
