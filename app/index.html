<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<meta name="description" content="A calm, fast to-do list.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Todos">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Todos</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/sidebar.css">
<link rel="stylesheet" href="css/project.css">
<link rel="stylesheet" href="css/rows.css">
<link rel="stylesheet" href="css/detail.css">
<link rel="stylesheet" href="css/composer.css">
<link rel="stylesheet" href="css/when.css">
<link rel="stylesheet" href="css/quickfind.css">
<link rel="stylesheet" href="css/repeat.css">
<link rel="stylesheet" href="css/account.css">
<link rel="stylesheet" href="css/sounds.css">
<script type="module" src="js/app.js"></script>
</head>
<body>
<div class="app" id="app" data-shot="app">
  <aside class="sidebar" id="sidebar" data-shot="sidebar" aria-label="Lists">
    <div class="sidebar-top"><h1 class="brand">Todos</h1></div>
    <div class="sidebar-search" id="sidebar-search"></div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
    <div class="sidebar-foot" id="sidebar-foot"></div>
  </aside>
  <main class="content" id="content" data-shot="content">
    <div class="topbar" id="topbar"></div>
    <div class="scroller" id="scroller">
      <section class="todoapp column" id="todoapp">
        <header class="list-header" id="list-header" data-shot="header"></header>
        <div class="list-body" id="list-body" data-shot="list-body">
          <section class="main" id="main">
            <input id="toggle-all" class="toggle-all" type="checkbox" aria-label="Complete all">
            <div class="groups" id="groups"></div>
          </section>
          <div class="composer" id="composer" data-shot="composer"></div>
          <div class="empty-state" id="empty-state" aria-hidden="true"></div>
        </div>
      </section>
    </div>
    <div class="toolbar" id="toolbar"></div>
  </main>
</div>
<div class="layer" id="layer"></div>
</body>
</html>
